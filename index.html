<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<title>CLUSTER IDE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
:root{--bg:#0b0c13;--panel:#11131f;--panel2:#171a2a;--line:#252a45;--text:#e7e9f6;--dim:#8b90b2;--c1:#00c8ff;--c2:#be46ff;--ok:#2ecc71;--warn:#f1c40f;--bad:#ff5c6c;--code:#0d1017;--r:12px}
[data-theme=light]{--bg:#f5f6fb;--panel:#ffffff;--panel2:#eef0f8;--line:#d9dcee;--text:#1b1e33;--dim:#646a8c;--code:#0d1017}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.grad{background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.dim{color:var(--dim)}.err{color:var(--bad);min-height:1.3em;margin:.4rem 0 0}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:.42rem .8rem;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--c2)}.btn.primary{background:linear-gradient(90deg,var(--c1),var(--c2));color:#fff;border:0;font-weight:600}
.btn.sm{padding:.2rem .55rem;font-size:13px}.btn.bad{border-color:var(--bad);color:var(--bad)}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:.5rem .7rem;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--c2)}
.overlay{position:fixed;inset:0;background:rgba(5,6,12,.72);display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(4px);padding:16px}
.overlay[hidden],[hidden]{display:none!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.4rem;width:min(440px,100%);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.card h1{margin:.1rem 0 0;font-size:30px;letter-spacing:.5px}
.card label{display:block;margin:.8rem 0 0;font-size:13px;color:var(--dim)}.card label input{display:block;width:100%;margin-top:.25rem;color:var(--text)}
.card .btn.primary{width:100%;margin-top:1rem;padding:.65rem}
#modalCard{width:min(760px,100%);max-height:88vh;overflow:auto}
#app{display:grid;grid-template-columns:272px 1fr;grid-template-rows:52px 1fr;height:100%}
#top{grid-column:1/3;display:flex;align-items:center;gap:.6rem;padding:0 .9rem;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;white-space:nowrap}
#top .logo{font-weight:800;font-size:18px;letter-spacing:.6px;margin-right:.3rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:.18rem .65rem;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
#spacer{flex:1}
#side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#side .head{padding:.7rem}#newChat{width:100%}
#chatList{overflow:auto;padding:0 .5rem .7rem;flex:1}
.ci{padding:.5rem .6rem;border-radius:9px;cursor:pointer;font-size:14px;border:1px solid transparent}
.ci:hover{background:var(--panel2)}.ci.on{background:var(--panel2);border-color:var(--c2)}
.ci .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ci .m{font-size:12px;color:var(--dim)}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#feed{flex:1;overflow:auto;padding:1rem 1.2rem 0;scroll-behavior:smooth}
.wrap{max-width:900px;margin:0 auto}
.msg{margin:0 0 1.1rem}.msg .who{font-size:12px;color:var(--dim);margin-bottom:.2rem;letter-spacing:.4px}
.msg.user .bubble{background:linear-gradient(135deg,rgba(0,200,255,.14),rgba(190,70,255,.16));border:1px solid var(--line);border-radius:var(--r);padding:.6rem .85rem;white-space:pre-wrap;word-break:break-word}
.msg.user .imgs img{max-height:120px;border-radius:8px;margin:.3rem .3rem 0 0;border:1px solid var(--line)}
.md{word-break:break-word}.md p{margin:.45em 0}.md pre{background:var(--code);color:#e6edf3;border-radius:10px;padding:.7rem .85rem;overflow:auto;position:relative;font-size:13px}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}.md :not(pre)>code{background:var(--panel2);padding:.1rem .35rem;border-radius:5px}
.md table{border-collapse:collapse}.md th,.md td{border:1px solid var(--line);padding:.3rem .6rem}.md a{color:var(--c1)}
.md pre .copy{position:absolute;top:6px;right:6px;opacity:0;transition:.15s}.md pre:hover .copy{opacity:1}
details.think{border:1px dashed var(--line);border-radius:10px;padding:.3rem .7rem;margin:.3rem 0;color:var(--dim);font-size:13px}
details.think .tt{white-space:pre-wrap;max-height:180px;overflow:auto;margin-top:.3rem}
.tool{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;margin:.5rem 0;background:var(--panel);overflow:hidden}
.tool.done{border-left-color:var(--ok)}.tool.fail{border-left-color:var(--bad)}.tool.local{border-left-color:var(--c2)}
.tool .th{display:flex;gap:.5rem;align-items:center;padding:.35rem .7rem;font-size:13px;background:var(--panel2);cursor:pointer}
.tool .th .sp{flex:1}.tool .tb{padding:.4rem .7rem;font-size:13px}
.tool pre{margin:.2rem 0;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
.tool .res{border-top:1px solid var(--line);color:var(--dim)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:0 .45rem;color:var(--dim)}
.foot{font-size:12px;color:var(--dim);margin-top:.3rem}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--c2);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:.4rem}
@keyframes s{to{transform:rotate(360deg)}}
#composer{padding:.6rem 1.2rem 1rem}#cwrap{max-width:900px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:.5rem .6rem}
#cwrap:focus-within{border-color:var(--c2)}
#input{width:100%;border:0;background:transparent;resize:none;max-height:220px;padding:.4rem .4rem;font-size:15px}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}.row.opts{margin-top:.2rem;font-size:13px;color:var(--dim)}
.row.opts select{padding:.2rem .4rem;font-size:13px}
#send{margin-left:auto;width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));font-size:18px}
#send.stop{background:var(--bad)}
#attach{display:flex;gap:.4rem;flex-wrap:wrap}.att{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:.15rem .5rem;font-size:12px;display:flex;gap:.4rem;align-items:center}
.att img{height:28px;border-radius:4px}
#drawer{position:fixed;top:52px;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:.2s;z-index:20;display:flex;flex-direction:column}
#drawer.open{transform:none}#drawer .tabs{display:flex;gap:.4rem;padding:.6rem;border-bottom:1px solid var(--line)}#drawer .body{overflow:auto;padding:.8rem;flex:1}
.mach{border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;margin-bottom:.8rem;background:var(--panel2)}
.mach h3{margin:0 0 .4rem;font-size:15px;display:flex;gap:.5rem;align-items:center}.mach .r{display:grid;grid-template-columns:62px 1fr;gap:.2rem .6rem;font-size:13px;align-items:center}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}.bar i.w{background:var(--warn)}.bar i.h{background:var(--bad)}
.spark{vertical-align:middle}.mono{font-family:ui-monospace,Menlo,monospace}
.diff{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--code);color:#d6dbe6;border-radius:8px;padding:.5rem;overflow:auto;max-height:46vh;white-space:pre}
.diff .a{background:rgba(46,204,113,.18);display:block}.diff .d{background:rgba(255,92,108,.2);display:block}.diff .h{color:#8b90b2;display:block}
#burger{display:none}
@media(max-width:820px){#app{grid-template-columns:1fr}#side{position:fixed;top:52px;left:0;bottom:0;width:272px;z-index:15;transform:translateX(-100%);transition:.2s}#side.open{transform:none}#burger{display:inline-block}#top{grid-column:1}}
</style>
</head>
<body>

<div id="login" class="overlay" hidden>
  <form id="loginForm" class="card" autocomplete="on">
    <h1 class="grad">CLUSTER IDE</h1>
    <div class="dim">private cluster AI · your own hardware</div>
    <label id="baseRow">Cluster address <input id="base" placeholder="https://xxxx.trycloudflare.com" autocapitalize="off" spellcheck="false"></label>
    <label>Passphrase <input id="pass" type="password" autocomplete="current-password"></label>
    <label id="codeRow" hidden>Authenticator code <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label>
    <button class="btn primary">Sign in</button>
    <p id="loginErr" class="err"></p>
    <div class="dim" style="font-size:12px">Your address is the link <code>ide</code> prints, e.g. https://….trycloudflare.com</div>
  </form>
</div>

<div id="app" hidden>
  <header id="top">
    <button id="burger" class="btn sm">☰</button>
    <span class="logo grad">CLUSTER IDE</span>
    <span class="chip"><span class="dot" id="dPlan"></span><span id="cPlan">connecting…</span></span>
    <select id="policy" class="chip" title="Session type">
      <option value="auto">⚖ Auto · 27B + minions</option><option value="fast">⚡ Fast · 35B</option><option value="strong">🧠 Strong · 27B long thinking</option>
    </select>
    <span class="chip" title="Maple minions"><span class="dot" id="dMin"></span><span id="cMin">minions</span></span>
    <span class="chip" id="cMem" title="AGX board memory">AGX</span>
    <span id="spacer"></span>
    <button class="btn sm" id="bMon">📊 Monitor</button>
    <button class="btn sm" id="bFiles">📁 Files</button>
    <button class="btn sm" id="bTheme" title="Light / dark">◐</button>
    <button class="btn sm" id="bOut">Sign out</button>
  </header>

  <aside id="side">
    <div class="head"><button class="btn primary" id="newChat">＋ New conversation</button></div>
    <div id="chatList"></div>
  </aside>

  <main id="main">
    <div id="feed"><div class="wrap" id="wrap"></div></div>
    <div id="composer">
      <div id="cwrap">
        <div id="attach"></div>
        <textarea id="input" rows="1" placeholder="Ask, or describe what to build…   (Enter sends · Shift+Enter new line · paste or drop images and files)"></textarea>
        <div class="row opts">
          <button class="btn sm" id="bAttach" title="Attach files or images">📎</button><input id="fileIn" type="file" multiple hidden>
          <select id="mode" title="Where the AI works"><option value="sandbox">☁ Cluster sandbox</option><option value="folder">📁 My folder</option></select>
          <button class="btn sm" id="bPick" hidden>Open folder…</button><span id="folderName" class="mono"></span>
          <select id="effort" title="How long the AI thinks"><option value="auto">thinking: auto</option><option value="low">thinking: low</option><option value="medium">thinking: medium</option><option value="high">thinking: high</option></select>
          <label id="autoRow" hidden><input type="checkbox" id="autoEdits"> auto-approve file changes</label>
          <button id="send" title="Send">↑</button>
        </div>
      </div>
    </div>
  </main>

  <section id="drawer">
    <div class="tabs"><button class="btn sm" id="tMon">Monitor</button><button class="btn sm" id="tFiles">Workspace files</button><span style="flex:1"></span><button class="btn sm" id="tClose">✕</button></div>
    <div class="body" id="dBody"></div>
  </section>
</div>

<div id="modal" class="overlay" hidden><div class="card" id="modalCard"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const S = { base: "", token: "", exp: 0, chat: null, mode: "sandbox", dir: null, autoEdits: false, running: false, job: null, abort: null, images: [], files: [], status: null, drawer: "", lastQ: "" };
const LS = { get: k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
const TITLES = { web_search: "🔎 web search", fetch_url: "🌐 read page", run_shell: "💻 shell", write_file: "📝 write file", read_file: "📄 read file", list_files: "📂 list files", edit_file: "✏ edit file",
  search_files: "🔎 search files", sandbox_python: "🐍 cluster sandbox python", run_python: "🐍 python", delegate_code: "🤖 minion writes code", git_clone: "🐙 git clone", run_on_agx: "⚡ AGX GPU job", git_push: "⬆ git push", github_pr: "🔀 pull request" };
const LOCAL_TOOLS = ["read_file", "write_file", "edit_file", "list_files", "search_files", "run_shell"];
const FAIL_RE = /(Traceback \(most recent|exit code (?!0\b)\d+|\bError\b:|could not|command not found|No such file|FAILED|AssertionError)/;

// ------------------------------------------------------------ setup
(function init() {
  const dark = !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = LS.get("ide_theme") || (dark ? "dark" : "light");
  const h = decodeURIComponent(location.hash.slice(1));
  if (/^https?:\/\//.test(h)) { S.base = h.replace(/\/+$/, ""); LS.set("ide_base", S.base); history.replaceState(null, "", location.pathname + location.search); }
  else S.base = LS.get("ide_base") || (/^https?:$/.test(location.protocol) && !/github\.io$|localhost$|^$/.test(location.hostname) ? location.origin : "");
  S.token = LS.get("ide_token"); S.exp = +LS.get("ide_exp") || 0;
  if (S.base && LS.get("ide_token_base") && LS.get("ide_token_base") !== S.base) { S.token = ""; }
  $("#loginForm").addEventListener("submit", doLogin);
  bindUI();
  if (S.token && S.exp > Date.now()) startApp(); else showLogin("");
})();

function bindUI() {
  $("#send").onclick = () => (S.running ? stopRun() : send());
  $("#input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!S.running) send(); } if (e.key === "Escape" && S.running) stopRun(); });
  $("#input").addEventListener("input", autosize);
  $("#input").addEventListener("paste", e => { const items = [...(e.clipboardData || {}).items || []].filter(i => i.kind === "file"); if (items.length) { e.preventDefault(); items.forEach(i => addAttach(i.getAsFile())); } });
  document.addEventListener("dragover", e => e.preventDefault());
  document.addEventListener("drop", e => { e.preventDefault(); [...(e.dataTransfer || {}).files || []].forEach(addAttach); });
  $("#bAttach").onclick = () => $("#fileIn").click();
  $("#fileIn").onchange = e => { [...e.target.files].forEach(addAttach); e.target.value = ""; };
  $("#newChat").onclick = newChat;
  $("#bTheme").onclick = () => { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; LS.set("ide_theme", t); };
  $("#bOut").onclick = logout;
  $("#burger").onclick = () => $("#side").classList.toggle("open");
  $("#bMon").onclick = () => openDrawer("mon"); $("#tMon").onclick = () => openDrawer("mon");
  $("#bFiles").onclick = () => openDrawer("files"); $("#tFiles").onclick = () => openDrawer("files");
  $("#tClose").onclick = closeDrawer;
  $("#policy").onchange = e => setPolicy(e.target.value);
  $("#mode").onchange = e => setMode(e.target.value);
  $("#bPick").onclick = pickFolder;
  $("#effort").value = LS.get("ide_effort") || "auto"; $("#effort").onchange = e => LS.set("ide_effort", e.target.value);
  $("#autoEdits").onchange = e => { S.autoEdits = e.target.checked; };
  document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); newChat(); } });
}
function autosize() { const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(220, t.scrollHeight) + "px"; }

// ------------------------------------------------------------ api + login
async function api(path, opt = {}) {
  const h = Object.assign({}, opt.headers || {});
  if (S.token) h.Authorization = "Bearer " + S.token;
  let body = opt.body;
  if (body && typeof body === "object" && !(body instanceof Blob) && !(body instanceof ArrayBuffer) && !(body instanceof Uint8Array)) { body = JSON.stringify(body); h["Content-Type"] = "application/json"; }
  const r = await fetch(S.base + path, { method: opt.method || (body !== undefined ? "POST" : "GET"), headers: h, body, signal: opt.signal });
  if (r.status === 401 && !opt.noauth) { showLogin("Your login expired: sign in again."); throw new Error("401"); }
  return r;
}
async function jget(path) { const r = await api(path); return r.json(); }

async function showLogin(msg) {
  $("#app").hidden = true; $("#login").hidden = false;
  $("#loginErr").textContent = msg || "";
  $("#base").value = S.base; $("#baseRow").hidden = !!S.base && S.base === location.origin;
  try { if (S.base) { const r = await fetch(S.base + "/auth/info"); const d = await r.json(); $("#codeRow").hidden = !d.code_required; } } catch (e) { $("#loginErr").textContent = msg || "Can't reach the cluster at that address."; }
  setTimeout(() => ($("#pass").value ? 0 : (S.base ? $("#pass") : $("#base")).focus()), 50);
}
async function doLogin(e) {
  e.preventDefault();
  const b = $("#base").value.trim().replace(/\/+$/, "");
  if (b) S.base = /^https?:\/\//.test(b) ? b : "https://" + b;
  if (!S.base) { $("#loginErr").textContent = "Enter your cluster address."; return; }
  $("#loginErr").textContent = "";
  try {
    const r = await fetch(S.base + "/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ passphrase: $("#pass").value, code: ($("#code").value || "").trim() }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $("#loginErr").textContent = d.error || "Login failed (" + r.status + ")"; return; }
    S.token = d.token; S.exp = Date.now() + (d.expires_in || 43200) * 1000 - 60000;
    LS.set("ide_token", S.token); LS.set("ide_exp", String(S.exp)); LS.set("ide_base", S.base); LS.set("ide_token_base", S.base);
    $("#pass").value = ""; $("#code").value = "";
    startApp();
  } catch (err) { $("#loginErr").textContent = "Can't reach " + S.base + ". Is the address right and the cluster running?"; }
}
async function logout() { try { await api("/auth/logout", { body: {}, noauth: true }); } catch (e) {} LS.del("ide_token"); LS.del("ide_exp"); S.token = ""; showLogin(""); }

// ------------------------------------------------------------ app start, status, chats
let statusTimer = null;
function startApp() {
  $("#login").hidden = true; $("#app").hidden = false;
  S.mode = "sandbox"; $("#mode").value = "sandbox"; setMode("sandbox", true);
  newChat(true);
  refreshStatus(); loadChats();
  clearInterval(statusTimer); statusTimer = setInterval(refreshStatus, 6000);
}
function modelName(st) {
  const f = ((st.planner || {}).file || st.alias || "");
  if (/27/.test(f)) return ["Qwen3.8-27B uncensored", "strong"];
  if (/35/.test(f)) return ["Qwen3.6-35B-A3B uncensored", "fast"];
  return [f || "offline", ""];
}
async function refreshStatus() {
  if ($("#app").hidden) return;
  try {
    const st = await jget("/api/ide_status"); S.status = st;
    const [nm, role] = modelName(st), ok = st.health === "ok";
    $("#cPlan").textContent = nm + (role ? " · " + role : ""); $("#dPlan").className = "dot " + (ok ? "ok" : "warn");
    if (document.activeElement !== $("#policy") && !S.switching) $("#policy").value = st.policy || "auto";
    const mins = st.minions || [], mh = mins.filter(m => m.healthy).length;
    $("#cMin").textContent = "minions " + mh + "/" + mins.length; $("#dMin").className = "dot " + (mh === mins.length && mh ? "ok" : mh ? "warn" : "bad");
    const mem = (st.mem_avail_mb || 0) / 1024; $("#cMem").textContent = "AGX " + mem.toFixed(1) + " GB free · GPU " + (st.gpu_temp_c || "?") + "°C";
    $("#cMem").style.borderColor = mem < 1.5 ? "var(--bad)" : "";
  } catch (e) { $("#cPlan").textContent = "can't reach the cluster"; $("#dPlan").className = "dot bad"; }
}
function ago(ts) { const d = Date.now() / 1000 - ts; return d < 90 ? "just now" : d < 5400 ? Math.round(d / 60) + " min ago" : d < 129600 ? Math.round(d / 3600) + " h ago" : new Date(ts * 1000).toLocaleDateString(); }
async function loadChats() {
  try {
    const cs = await jget("/api/chats"); const box = $("#chatList"); box.innerHTML = "";
    (cs || []).slice(0, 60).forEach(c => {
      const d = el("div", "ci" + (S.chat && S.chat.id === c.id ? " on" : ""));
      d.innerHTML = '<div class="t">' + (c.pending ? "● " : "") + esc(c.title || "(untitled)") + '</div><div class="m">' + c.n + " messages · " + ago(c.updated) + "</div>";
      d.onclick = () => openChat(c.id); box.appendChild(d);
    });
  } catch (e) {}
}
function newChat(silent) {
  if (S.running) return;

    const base = await dirAt(splitPath(a.path || "."));
    for await (const e of walk(base, "", 12)) { if (e.dir || !e.handle) continue; const nm = e.path.split("/").pop(); if (nm.startsWith(".") || (glob && !glob.test(nm))) continue;
      const f = await e.handle.getFile(); if (f.size > 1.5e6) continue; const t = await f.text(); if (/\0/.test(t.slice(0, 4000))) continue; scanned++;
      const L = t.split("\n"); for (let i = 0; i < L.length; i++) if (rx.test(L[i])) { hits.push(e.path + ":" + (i + 1) + ": " + L[i].trim().slice(0, 200)); if (hits.length >= 80) break; }
      if (hits.length >= 80 || Date.now() - t0 > 15000) break; }
    return (hits.join("\n") || "no matches") + `\n[${hits.length} match(es) in ${scanned} files]`;
  },
  async edit_file(a) {
    if (splitPath(a.path).includes(".git")) return "Error: writing inside .git is not allowed";
    let old; try { old = await readText(a.path); } catch (e) { return "Error: no such file: " + a.path + " (use write_file to create it)"; }
    const o = a.old_string, n = a.new_string; if (o === n) return "Error: old_string and new_string are identical";
    const cnt = old.split(o).length - 1; if (!cnt) return "Error: old_string was not found: it must match the file exactly, including indentation (read_file it again)";
    if (cnt > 1 && !a.replace_all) return `Error: old_string appears ${cnt} times; add surrounding lines to make it unique, or set replace_all`;
    const next = a.replace_all ? old.split(o).join(n) : old.replace(o, () => n);
    if (!(await approve("✏ Edit <code>" + esc(a.path) + "</code>", diffHtml(lineDiff(old, next))))) return "The user declined this edit.";
    await writeText(a.path, next); return `edited ${a.path}: ${a.replace_all ? cnt : 1} replacement(s)`;
  },
  async write_file(a) {
    if (splitPath(a.path).includes(".git")) return "Error: writing inside .git is not allowed";
    let old = null; try { old = await readText(a.path); } catch (e) {}
    const by = a.by === "minion" ? " (written by a minion)" : "", body = old == null ? '<div class="diff">' + esc((a.content || "").split("\n").slice(0, 60).join("\n")) + "</div>" : diffHtml(lineDiff(old, a.content || ""));
    if (!(await approve((old == null ? "📝 New file <code>" : "📝 Overwrite <code>") + esc(a.path) + "</code>" + by, body))) return "The user declined this change.";
    await writeText(a.path, a.content || ""); return `wrote ${a.path} (${new Blob([a.content || ""]).size} bytes)`;
  },
};
async function runLocalTool(ev) {
  let result; const fn = LT[ev.tool];
  try { result = S.dir && fn ? await fn(ev.args || {}) : "The user's folder is not open in the browser (or this tool is not available in the browser)."; }
  catch (e) { result = "Error: " + (e && e.message || e); }
  for (let i = 0; i < 5; i++) { try { const r = await api("/api/tool_result", { body: { id: ev.id, result } }); if (r.ok) return; } catch (e) {} await sleep(1500); }
}

// ------------------------------------------------------------ drawer: monitor + workspace files
let monTimer = null;
function openDrawer(which) { S.drawer = which; $("#drawer").classList.add("open"); renderDrawer(); }
function closeDrawer() { S.drawer = ""; $("#drawer").classList.remove("open"); clearInterval(monTimer); }
function renderDrawer() { clearInterval(monTimer); if (S.drawer === "mon") { monitor(); monTimer = setInterval(monitor, 1500); } else filesPanel(); }
function spark(vals, w, h, color, max) { vals = (vals || []).slice(-60); if (vals.length < 2) return ""; const m = max || Math.max(...vals, 1), pts = vals.map((v, i) => (i / (vals.length - 1) * w).toFixed(1) + "," + (h - Math.min(1, v / m) * h).toFixed(1)).join(" "); return `<svg class="spark" width="${w}" height="${h}"><polyline fill="none" stroke="${color}" stroke-width="1.6" points="${pts}"/></svg>`; }
function bar(p) { p = Math.max(0, Math.min(100, p || 0)); return `<div class="bar"><i class="${p > 85 ? "h" : p > 60 ? "w" : ""}" style="width:${p}%"></i></div>`; }
const rate = b => ((b || 0) >= 1e5 ? ((b / 1e6).toFixed(1) + " MB/s") : (Math.round((b || 0) / 1e3) + " KB/s"));
async function monitor() {
  if (S.drawer !== "mon") return;
  try {
    const d = await jget("/api/top"), body = $("#dBody"); let h = "";
    (d.nodes || []).forEach(n => {
      const agx = n.kind === "agx", ram = n.ram || {}, used = ram.used_mb || 0, tot = Math.max(ram.total_mb || 1, 1), hs = n.hist || {};
      let rows = `<span>CPU</span><span>${bar(n.cpu_pct)}<span class="dim mono">${(n.cpu_pct || 0).toFixed(0)}% ${spark(hs.cpu, 90, 18, "#00c8ff", 100)}</span></span>`;
      rows += `<span>MEM</span><span>${bar(used / tot * 100)}<span class="dim mono">${(used / 1024).toFixed(1)} / ${(tot / 1024).toFixed(0)} GB</span></span>`;
      if (agx) { rows += `<span>GPU</span><span>${bar(n.gpu_load_pct)}<span class="dim mono">${(n.gpu_load_pct || 0).toFixed(0)}% ${spark(hs.gpu, 90, 18, "#be46ff", 100)}</span></span>`;
        const t = n.temps || {}; rows += `<span>temp</span><span class="mono">cpu ${t.cpu}° · gpu ${t.gpu}° · soc ${t.soc}° · tj ${t.tj}°</span><span>power</span><span class="dim">n/a (the board's power meter isn't visible to Linux)</span>`; }
      else { rows += `<span>iGPU</span><span class="mono">${n.gpu_mhz || 0}/${n.gpu_max_mhz || 0} MHz</span><span>temp</span><span class="mono">cpu ${n.temp_cpu}° · ssd ${n.temp_ssd}° · fan ${n.fan_rpm} rpm</span>`;
        rows += `<span>power</span><span class="mono">${n.power_w != null ? n.power_w.toFixed(1) + " W " + spark(hs.power, 90, 18, "#f1c40f") + ' <span class="dim">CPU package</span>' : "n/a"}</span>`; }
      rows += `<span>net</span><span class="mono">↓ ${rate((n.net || {}).rx_bps)} · ↑ ${rate((n.net || {}).tx_bps)}</span><span>disk</span><span class="mono">${(n.disk || {}).free_gb} GB free</span>`;
      const pr = (n.ai_processes || []).slice(0, 3).map(p => `${esc(p.model || p.program)} ${(p.ram_mb / 1024).toFixed(1)} GB · cpu ${p.cpu_pct}%`).join("<br>") || "idle";
      rows += `<span>work</span><span class="mono">${pr}</span>`;
      h += `<div class="mach"><h3><span class="dot ${n.online ? "ok" : "bad"}"></span>${esc(n.name)} <span class="dim" style="font-weight:400;font-size:12px">${esc((n.role || "").slice(0, 40))}</span></h3><div class="r">${rows}</div></div>`;
    });
    const ai = d.ai || {}, st = d.status || {}, hh = ai.hist || {};
    h += `<div class="mach"><h3>AI cluster</h3><div class="r"><span>planner</span><span class="mono">${esc(((ai.model || {}).name) || st.alias || "?")} · ${esc(st.policy || "")} · <b>${esc(ai.phase || "")}</b></span>
      <span>writing</span><span class="mono">${(ai.gen_tps || 0).toFixed(1)} tok/s ${spark(hh.gen, 120, 18, "#2ecc71")}</span><span>reading</span><span class="mono">${(ai.prefill_tps || 0).toFixed(0)} tok/s ${spark(hh.prefill, 120, 18, "#f1c40f")}</span>
      <span>minions</span><span class="mono">${((st.minions || []).map(m => (m.healthy ? "●" : "○") + " busy " + m.active + " · served " + m.served)).join("  |  ")}</span></div></div>`;
    body.innerHTML = h;
  } catch (e) {}
}
async function filesPanel() {
  const body = $("#dBody");
  if (S.mode === "folder") { body.innerHTML = "<p class='dim'>You're working in <b>" + esc(S.dir ? S.dir.name : "(no folder)") + "</b> on this computer; the AI's changes are in that folder itself.</p>"; return; }
  try {
    const fs = await jget("/api/files/" + encodeURIComponent(S.chat.id)); body.innerHTML = "";
    if (!fs.length) { body.innerHTML = "<p class='dim'>No files yet in this conversation's workspace. Ask the AI to create or run something, or attach a file with 📎.</p>"; return; }
    fs.filter(f => !f.dir).forEach(f => { const row = el("div", "row"); row.style.cssText = "justify-content:space-between;padding:.3rem 0;border-bottom:1px solid var(--line)"; row.innerHTML = `<span class="mono">${esc(f.path)}</span><span class="dim">${f.size} B</span>`;
      const b = el("button", "btn sm", "Download"); b.onclick = async () => { const r = await api("/api/files/" + encodeURIComponent(S.chat.id) + "/" + f.path.split("/").map(encodeURIComponent).join("/") + "?download=1"); const u = URL.createObjectURL(await r.blob()); const a = el("a"); a.href = u; a.download = f.path.split("/").pop(); a.click(); setTimeout(() => URL.revokeObjectURL(u), 3000); };
      const v = el("button", "btn sm", "View"); v.onclick = async () => { const r = await api("/api/files/" + encodeURIComponent(S.chat.id) + "/" + f.path.split("/").map(encodeURIComponent).join("/")); const t = await r.text(); modal("<h3 style='margin-top:0'>" + esc(f.path) + "</h3><pre class='diff'>" + esc(t.slice(0, 60000)) + "</pre>", [["Close", null]]).querySelector(".row .btn").onclick = closeModal; };
      const g = el("span", "row"); g.append(v, b); row.appendChild(g); body.appendChild(row); });
  } catch (e) {}
}
